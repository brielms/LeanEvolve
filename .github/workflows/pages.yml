# Publishes https://brielms.github.io/LeanEvolve/ from the repository's own
# documentation sources.
#
# The site is generated by scripts/build_docs.py through the same locked Python
# environment every other Python task uses, so what CI publishes is what
# `mise run docs` produces locally. The link check gates deployment: a page that
# would 404 under the /LeanEvolve/ prefix fails the build instead of shipping.
name: Documentation site

on:
  push:
    branches: [master]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/build_docs.py"
      - "tests/test_build_docs.py"
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/build_docs.py"
      - "tests/test_build_docs.py"
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  workflow_dispatch:

permissions:
  contents: read

# Never let two deployments race; let an in-flight publish finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          # Kept in step with the [tools] pins in mise.toml. uv provisions the
          # interpreter itself from .python-version, so the pin is not repeated
          # here where it could drift.
          version: "0.11.32"
          enable-cache: true

      - name: Build the site and check every internal link
        run: uv run --locked python scripts/build_docs.py --check

      - name: Verify the builder's own tests
        run: uv run --locked --extra dev pytest tests/test_build_docs.py -q

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # A pull request proves the site builds; only master publishes it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
