name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Build example
        working-directory: examples/demo/lean
        run: lake build
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Release audit
        run: python scripts/release_audit.py
