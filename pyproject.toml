[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean-evolve"
version = "0.1.0"
description = "Kernel-scored Lean proof discovery with ShinkaEvolve"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LeanEvolve contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
shinka = [
  "shinka-evolve @ git+https://github.com/SakanaAI/ShinkaEvolve.git@b67a07328ab7e21e999d9e20a44f4f0054a4b83c",
]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
leanevolve = "leanevolve.workflow.cli:entrypoint"
leanevolve-ledger = "leanevolve.ledger.cli:main"
leanevolve-evaluate = "leanevolve.evaluate:main"
leanevolve-replay = "leanevolve.replay:main"
leanevolve-run = "leanevolve.run:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.uv]
required-version = ">=0.11"

[tool.hatch.build.targets.wheel]
packages = ["src/leanevolve"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
